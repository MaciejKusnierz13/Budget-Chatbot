<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Chatbot</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@400;600&family=Sora:wght@300;400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

</head>

<body data-style="dark-gray">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-mark" id="logoMark" style="cursor:pointer" title="Wróć do chatu">B</div>
      <div class="logo-name">Budget Chatbot</div>
    </div>
    <button class="new-chat-btn" data-action="new-chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Nowy chat
    </button>
    <div class="sidebar-section-label">Historia</div>
    <div class="chat-list">
      <div class="chat-item active" data-action="open-chat" data-chat-id="1">
        <div class="chat-item-title">A</div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-footer-btn" data-action="go-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        Ustawienia
      </div>
      <div class="sidebar-footer-btn" data-action="go-help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        Pomoc
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="topbar-title" id="topbarTitle">A</span>
      <div class="topbar-actions">
        <div class="style-switcher" title="Zmień styl">
          <div class="style-dot active" data-s="dark-gray" title="Dark Gray"></div>
          <div class="style-dot" data-s="coral" title="Coral &amp; Teal"></div>
          <div class="style-dot" data-s="crimson" title="Crimson"></div>
          <div class="style-dot" data-s="neon" title="Neon"></div>
        </div>
        <div class="profile-trigger" id="profileTrigger" title="Profil użytkownika">
          <img id="topAvatarImg" alt="avatar" />
          <span class="avatar-initials" id="topAvatarInitials">JK</span>
        </div>
        <div class="profile-popup" id="profilePopup">
          <div class="popup-section-label">Profil</div>
          <div class="popup-avatar-row">
            <div class="popup-avatar-preview" id="popupAvatarPreview" title="Zmień zdjęcie">
              <img id="popupAvatarImg" alt="avatar" />
              <span class="big-initials" id="popupAvatarInitials">JK</span>
              <div class="avatar-overlay">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="17 8 12 3 7 8" />
                  <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
              </div>
            </div>
            <div class="avatar-hint">Kliknij aby zmienić zdjęcie</div>
            <input type="file" id="avatar-file-input" accept="image/*" />
          </div>
          <div class="popup-divider"></div>
          <div>
            <div class="popup-section-label" style="margin-bottom:6px">Nazwa</div>
            <input class="popup-name-input" id="profileNameInput" type="text" value="Jan Kowalski"
              placeholder="Twoja nazwa" />
          </div>
          <button class="popup-save-btn" id="profileSaveBtn">Zapisz</button>
        </div>
      </div>
    </div>

    <div class="page active" id="pageChatWrapper">
      <div class="chat-area">
        <div class="messages-wrapper">
          <div class="date-divider"><span>Dziś, A</span></div>
          <div class="msg-row user">
            <div class="msg-avatar" id="userMsgAvatar">
              <img id="userMsgAvatarImg" alt="" />
              <span id="userMsgAvatarInitials">JK</span>
            </div>
            <div>
              <div class="msg-bubble">&nbsp; &nbsp; &nbsp;</div>
              <div class="msg-meta" id="userMsgMeta">Jan Kowalski · A</div>
            </div>
          </div>
          <div class="msg-row ai">
            <div class="msg-avatar ai-avatar">BC</div>
            <div>
              <div class="msg-bubble">&nbsp; &nbsp; &nbsp;</div>
              <div class="msg-meta">Budget Chatbot · A</div>
            </div>
          </div>
        </div>
      </div>
      <div class="input-bar">
        <div class="input-inner">
          <div class="input-wrap">
            <button class="input-action-btn" title="Załącz plik">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
              </svg>
            </button>
            <textarea id="messageInput" rows="1" placeholder="Napisz wiadomość do Budget Chatbot…"></textarea>
          </div>
          <button class="send-btn" title="Wyślij">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast">Zapisano</div>
  <script src="script.js"></script>
</body>

</html>
